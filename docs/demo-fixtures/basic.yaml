coats:
  - name: get-users
    request:
      method: GET
      uri: /api/v1/users
    response:
      code: 200
      headers:
        Content-Type: application/json
      body: '{"users": [{"id": 1, "name": "Alice"}, {"id": 2, "name": "Bob"}]}'

  - name: create-user
    request:
      method: POST
      uri: /api/v1/users
    response:
      code: 201
      headers:
        Content-Type: application/json
      body: '{"id": 3, "name": "Charlie"}'
