version: "2"

# The linter *set* is pinned here rather than left to the default, so `make
# lint` and the CI Lint job at least run the same linters. Without it, each runs
# whatever the locally installed golangci-lint considers standard.
#
# This file cannot pin the linter *version*: `make lint` runs whatever is on
# PATH, and a different golangci-lint carries a different staticcheck vintage.
# The version is pinned only in .github/workflows/ci.yaml; `make lint` compares
# against it and warns on a mismatch, which is as close to parity as this gets.

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint # %v on an error breaks errors.Is/As downstream
    - misspell # enforces the British spelling the prose conventions ask for
    - unconvert
  settings:
    misspell:
      locale: UK

# bodyclose is deliberately absent: every HTTP client call in this repo is in a
# test, and the ones that matter hand the response to a helper that closes it
# from t.Cleanup. bodyclose cannot see through that, so it reports only false
# positives here.
